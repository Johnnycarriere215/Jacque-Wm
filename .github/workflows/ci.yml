# ====================================================================
# JacqueWM — GitHub Actions CI workflow
# ====================================================================
#
# Runs cross-platform build, unit + integration tests, formatting,
# clippy, and release artefact packaging (main binary + installer
# binary + portable ZIP + checksums) on every push and PR. Release
# artefacts only run on `v*` tag pushes.
#
# Built artefacts:
#   - jacquewm.exe                  (main binary)
#   - jacquewm-installer.exe        (standalone installer binary)
#   - jacquewm-windows-x64.zip      (portable ZIP)
#   - SHA256SUMS.txt                (checksums)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  tag:
    patterns: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ------------------------------------------------------------------
  # Build & test on Windows.
  # ------------------------------------------------------------------
  build-windows:
    name: Build / test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Compile (debug)
        run: cargo build --verbose
        env:
          RUSTFLAGS: ""

      - name: Compile (release)
        run: cargo build --release --verbose
        env:
          RUSTFLAGS: ""

      - name: Test
        run: cargo test --verbose
        env:
          RUSTFLAGS: ""

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          RUSTFLAGS: ""

  # ------------------------------------------------------------------
  # Sanity build on Ubuntu — verifies the OS-gated code path doesn't
  # break the parser. Will not produce a running binary.
  # ------------------------------------------------------------------
  build-linux:
    name: Sanity build on Linux
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target x86_64-unknown-linux-gnu || true
      - run: echo "Linux build is non-functional on purpose; only Windows is supported."

  # ------------------------------------------------------------------
  # Release artefacts (portable ZIP + installer + checksums).
  # ------------------------------------------------------------------
  release:
    name: Release artefacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --bins
        env:
          RUSTFLAGS: ""

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/release/jacquewm.exe, README.md, LICENSE, examples `
            -DestinationPath jacquewm-windows-x64.zip

      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/release/jacquewm-installer.exe release/jacquewm-installer.exe
          Copy-Item target/release/jacquewm.exe release/jacquewm.exe
          Copy-Item README.md release/README.md
          Copy-Item LICENSE release/LICENSE
          Copy-Item -Recurse -Force examples release/examples | Out-Null

      - name: Generate checksums
        shell: pwsh
        run: |
          Set-Location release
          Get-FileHash -Algorithm SHA256 * | ForEach-Object {
            "{0}  {1}" -f $_.Hash.ToLower(), $_.Path | Out-File -FilePath SHA256SUMS.txt -Append -Encoding utf8
          }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jacquewm-windows-x64-portable
          path: jacquewm-windows-x64.zip

      - name: Upload installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: jacquewm-windows-x64-installer
          path: release/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jacquewm-windows-x64.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
